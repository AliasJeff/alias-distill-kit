project_name: qwen-afm-distill
trust_remote_code: true
model: Qwen/Qwen3-0.6B
output_path: outputs/models/qwen-afm-distill
use_flash_attention: false
sequence_length: 8192
dataset:
  train_dataset:
    repo_id: QuixiAI/leet10k-alpaca
    split: train
  eval_dataset:
    repo_id: QuixiAI/leet10k-alpaca
    split: train
  seed: 42
  format_function: leet10k_format
  num_samples: 4000
  num_eval_samples: 100
loss_functions:
  - function: cross_entropy
    weight: 0.3
  - function: kl
    weight: 0.3
    temperature: 2.0
  - function: hs_cosine
    weight: 0.4
layer_mapping: all
teacher:
  kind: hf
  path: Qwen/Qwen3-1.7B
  kwargs:
    # attn_implementation: flash_attention_2
    torch_dtype: bfloat16
training_args:
  dataset_text_field: text
  packing: false
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  save_steps: 600
  save_total_limit: 1
  logging_steps: 1
  learning_rate: 1.0e-5
  weight_decay: 0.05
  warmup_ratio: 0.025
  lr_scheduler_type: cosine
  bf16: true
  max_grad_norm: 0.5
  optim: adamw_torch
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  # report_to: wandb
  push_to_hub: false
  dataset_num_proc: 16
