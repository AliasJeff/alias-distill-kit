project_name: qwen-afm-distill
trust_remote_code: true
model: Qwen/Qwen3-1.7B
output_path: outputs/models/qwen3-1.7-student
use_flash_attention: true
sequence_length: 8192
dataset:
  train_dataset:
    repo_id: QuixiAI/leet10k-alpaca
    split: train
  eval_dataset:
    repo_id: QuixiAI/leet10k-alpaca
    split: train
  seed: 42
  format_function: leet10k_format
  num_samples: 6000
  num_eval_samples: 400
loss_functions:
  - function: cross_entropy
    weight: 0.3
  - function: kl
    weight: 0.3
    temperature: 2.0
  - function: hs_cosine
    weight: 0.4
layer_mapping: all
teacher:
  kind: hf
  path: Qwen/Qwen3-8B
  kwargs:
    attn_implementation: flash_attention_2
    torch_dtype: bfloat16
teacher_train:
  output_path: outputs/models/qwen3-8b-teacher
  lora:
    r: 8 # LoRA rank
    lora_alpha: 16 # LoRA alpha scaling factor
    lora_dropout: 0.05 # LoRA dropout rate
    # target_modules: null  # Auto-detect for Qwen models, or specify: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    bias: "none" # LoRA bias: "none", "all", or "lora_only"
    task_type: "CAUSAL_LM"
  training_args:
    dataset_text_field: text
    packing: false
    num_train_epochs: 3
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    save_steps: 600
    save_total_limit: 1
    logging_steps: 1
    learning_rate: 1.0e-5
    weight_decay: 0.05
    warmup_ratio: 0.025
    lr_scheduler_type: cosine
    bf16: true
    max_grad_norm: 0.5
    optim: adamw_torch
    gradient_checkpointing: true
    gradient_checkpointing_kwargs:
      use_reentrant: false
    push_to_hub: false
    dataset_num_proc: 16
training_args:
  dataset_text_field: text
  packing: false
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  save_steps: 600
  save_total_limit: 1
  logging_steps: 1
  learning_rate: 1.0e-5
  weight_decay: 0.05
  warmup_ratio: 0.025
  lr_scheduler_type: cosine
  bf16: true
  max_grad_norm: 0.5
  optim: adamw_torch
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  # report_to: wandb
  push_to_hub: false
  dataset_num_proc: 16
# Evaluation configuration
evaluation:
  output_path: outputs/evaluation_results
  max_new_tokens: 2048 # Maximum length for generated text
  batch_size: 4 # Batch size for evaluation
  num_samples: 400 # Number of evaluation samples (None means use all)
  device: cuda # Device: cuda or cpu
  # The following paths will be automatically extracted from the config above if not specified
  # original_teacher_path: Qwen/Qwen3-1.7B  # Original teacher model path (defaults to teacher.path)
  # trained_teacher_path: outputs/models/qwen3-1.7b-teacher  # Trained teacher model path (defaults to teacher_train.output_path)
  # original_student_path: outputs/models/qwen3-1.7b-teacher  # Original student model path (defaults to model)
  # distilled_student_path: outputs/models/qwen-afm-distill  # Distilled student model path (defaults to output_path)
